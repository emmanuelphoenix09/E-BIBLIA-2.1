<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Métadonnées de base de la page Léona. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Titre affiché par le navigateur / Android. -->
  <title>Léona — Assistant biblique IA — E-Biblia</title>

  <!-- Ressources visuelles communes de l'application. -->
  <link rel="stylesheet" href="./css/tailwind.css">
  <link rel="stylesheet" href="./offline-assets/fontawesome.css">
  <link rel="stylesheet" href="./offline-assets/google-fonts.css">
  <link rel="stylesheet" href="./css/main.css">

  <!-- CSS dédié à Léona : modifier ce fichier pour son apparence. -->
  <link rel="stylesheet" href="./css/ia.css">
</head>

<body data-page="ia" class="min-h-screen text-gray-900 dark:text-gray-100">
  <!-- ==========================================================
       INTERFACE DE LÉONA
       Toute la structure visuelle de l'assistant se trouve ici.
       Le fonctionnement reste dans js/ai.js et js/pages/ia.js.
       ========================================================== -->

  <div class="leona-page">

    <!-- En-tête indépendant de la page IA. -->
    <header class="leona-header">
      <div class="leona-header-inner">
        <a href="./lecture.html" class="leona-back">
          <i class="fa-solid fa-arrow-left mr-1"></i>
          Retour à la lecture
        </a>

        <div class="ml-auto text-sm font-semibold">
          Léona
        </div>
      </div>
    </header>

    <!-- Contenu principal de l'assistant. -->
    <main class="leona-main">
      <section class="leona-card">

        <!-- Présentation de Léona. -->
        <div class="leona-intro">
          <div class="flex items-center gap-3">
            <div class="leona-avatar">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>

            <div>
              <h1 class="leona-title">Léona</h1>
              <p class="leona-subtitle">
                Assistant d'étude biblique IA
              </p>
            </div>
          </div>
        </div>

        <!-- Passage actuellement sélectionné. -->
        <div id="ai-modal-reference" class="leona-reference">
          Aucun passage sélectionné pour le moment.
        </div>

        <!-- Zone dans laquelle l'utilisateur pose sa question. -->
        <div class="leona-question">
          <label for="ai-question" class="leona-label">
            Votre demande
          </label>

          <textarea
            id="ai-question"
            class="leona-textarea"
            rows="4"
            placeholder="Posez votre question sur ce passage…"
          ></textarea>

          <button id="btn-ai-submit" class="leona-submit" type="button">
            <i class="fa-solid fa-paper-plane mr-2"></i>
            Analyser avec Léona
          </button>
        </div>

        <!-- Réponse générée par Léona. -->
        <div id="ai-result" class="leona-result">
          <p class="text-gray-500 dark:text-gray-400 text-center py-8">
            L'explication du passage apparaîtra ici.
          </p>
        </div>

      </section>
    </main>
  </div>

  <!-- ==========================================================
       JAVASCRIPT
       Les scripts communs restent séparés du HTML.
       ========================================================== -->
  <script src="./js/common.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/bible-core.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/reader.js"></script>
  <script src="./js/ai.js"></script>
  <script src="./js/pages/ia.js"></script>
</body>
</html>
