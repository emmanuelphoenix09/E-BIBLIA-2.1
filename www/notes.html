<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notes de versets — E-Biblia</title><link rel="stylesheet" href="./css/tailwind.css"><link rel="stylesheet" href="./offline-assets/fontawesome.css"><link rel="stylesheet" href="./offline-assets/google-fonts.css"><link rel="stylesheet" href="./css/main.css"></head><body data-page="notes" class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100"><header class="sticky top-0 z-40 bg-white/95 dark:bg-gray-900/95 border-b border-gray-200 dark:border-gray-800"><div class="max-w-5xl mx-auto px-4 py-3 flex gap-3 items-center"><a href="./lecture.html" class="text-amber-600 font-semibold text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> Retour</a><h1 class="font-brand font-bold text-lg">Notes de versets</h1></div></header><main class="max-w-5xl mx-auto p-4 md:p-6"><div id="modal-verse-notes" class="app-modal bg-black/50 backdrop-blur-sm z-50 ">
