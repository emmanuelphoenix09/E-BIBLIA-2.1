<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cultes — E-Biblia</title><link rel="stylesheet" href="./css/tailwind.css"><link rel="stylesheet" href="./offline-assets/fontawesome.css"><link rel="stylesheet" href="./offline-assets/google-fonts.css"><link rel="stylesheet" href="./css/main.css"></head><body data-page="cultes" class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100"><header class="sticky top-0 z-40 bg-white/95 dark:bg-gray-900/95 border-b border-gray-200 dark:border-gray-800"><div class="max-w-5xl mx-auto px-4 py-3 flex gap-3 items-center"><a href="./lecture.html" class="text-amber-600 font-semibold text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> Retour</a><h1 class="font-brand font-bold text-lg">Cultes</h1></div></header><main class="max-w-5xl mx-auto p-4 md:p-6"><div id="modal-cults" class="app-modal bg-black/50 backdrop-blur-sm z-50 ">
        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-gray-200 dark:border-gray-800">
            <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                <h3 class="font-brand font-bold text-lg"><i class="fa-solid fa-church text-amber-500 mr-2"></i>Cultes</h3>
                
            </div>
            <div class="p-4 border-b border-gray-200 dark:border-gray-800 grid gap-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input id="cult-date" type="date" class="input-app">
                    <input id="cult-theme" placeholder="Thème du culte" class="input-app">

        </div>
    </div></main><script src="./js/common.js"></script><script src="./js/config.js"></script><script src="./js/bible-core.js"></script><script src="./js/app.js"></script>
