name: Construire APK E-Biblia

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les données bibliques
        run: npm run prepare:bible-data

      - name: Générer le projet Android Capacitor
        run: npx cap add android

      - name: Générer les icônes Android
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0f3b82' \
            --iconBackgroundColorDark '#071a3a' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#ffffff'

      - name: Synchroniser E-Biblia
        run: npx cap sync android

      - name: Construire l'APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Vérifier l'APK généré
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Biblia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
