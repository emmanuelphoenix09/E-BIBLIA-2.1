  <rect width="600" height="320" fill="url(#skyLight)" />
  <rect width="600" height="320" fill="url(#sunGlowLight)" />
  <circle cx="480" cy="80" r="30" fill="#fffbeb" opacity="0.9" filter="drop-shadow(0 0 10px #fde68a)" />
