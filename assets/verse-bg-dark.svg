<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#431407" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mount1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="mount2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  <rect width="600" height="320" fill="url(#skyDark)" />
  <rect width="600" height="320" fill="url(#sunGlow)" />
  <!-- Stars -->
  <circle cx="50" cy="40" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="25" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="190" cy="55" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="280" cy="30" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="360" cy="60" r="1.2" fill="#fff" opacity="0.9"/>
  <!-- Mountain layer 1 -->
  <path d="M-20 230 L100 140 L210 200 L340 120 L480 210 L620 130 L620 320 L-20 320 Z" fill="url(#mount1)" opacity="0.7" />
  <!-- Mountain layer 2 -->
  <path d="M-20 270 L80 190 L180 240 L310 170 L430 230 L550 175 L620 210 L620 320 L-20 320 Z" fill="url(#mount2)" />
  <!-- Mist / Fog -->
  <path d="M0 250 Q150 230 300 260 T600 240 L600 320 L0 320 Z" fill="#090a0f" opacity="0.65" filter="url(#blur)" />
</svg>
