name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Préparation de la structure du projet
        run: |
          if [ -d "E-Biblia-GitHub-APK-ready" ]; then
            echo "Sous-dossier E-Biblia-GitHub-APK-ready détecté. Déplacement des fichiers à la racine..."
            cp -rn E-Biblia-GitHub-APK-ready/* . || true
          fi

      - name: Installation des dépendances npm
        run: |
          npm install

      - name: Synchronisation Capacitor (si présent)
        run: |
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npx cap sync android
          else
            echo "Information: Aucune configuration Capacitor détectée."
          fi

      - name: Compilation de l'APK Android
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Erreur: Le dossier 'android' est absent du projet. La compilation nécessite un projet Android configuré."
            exit 1
          fi

      - name: Téléversement de l'APK généré
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: E-Biblia-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
