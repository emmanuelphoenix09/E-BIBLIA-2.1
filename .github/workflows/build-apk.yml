name: Construire APK E-Biblia

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les données bibliques
        run: npm run prepare:bible-data

      - name: Préparer les ressources visuelles hors ligne
        run: |
          mkdir -p www/offline-assets/webfonts
          curl -L --fail -o www/offline-assets/fontawesome.css https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css
          grep -oE '../webfonts/[^)]+' www/offline-assets/fontawesome.css | sed 's#../webfonts/##' | sort -u | while read f; do
            curl -L --fail -o "www/offline-assets/webfonts/$f" "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/$f"
          done
          sed -i 's#../webfonts/#./webfonts/#g' www/offline-assets/fontawesome.css
          curl -L --fail -o www/offline-assets/google-fonts.css 'https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap'

      - name: Vérifier le contenu web
        run: |
          test -f www/index.html
          test -d www/bible-data
          echo "Contenu de www/bible-data :"
          find www/bible-data -maxdepth 3 -type f | head -100

      - name: Générer le projet Android Capacitor
        run: npx cap add android

      - name: Générer les icônes et le splash Android
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0f3b82' \
            --iconBackgroundColorDark '#071a3a' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#ffffff'

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Construire l'APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Vérifier l'APK généré
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Biblia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
