name: Build APK E-Biblia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Construire E-Biblia APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier Capacitor
        run: npx cap doctor

      - name: Synchroniser l'application avec Android
        run: npx cap sync android

      - name: Donner les permissions à Gradle
        run: chmod +x android/gradlew

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Vérifier que l'APK existe
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Biblia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
