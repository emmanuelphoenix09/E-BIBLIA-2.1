name: Construire APK et AAB E-Biblia

on:
  workflow_dispatch:
  push:
    branches:
      - E-BIBLIA-3.0

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android signé
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les données bibliques
        run: npm run prepare:bible-data

      - name: Préparer les ressources visuelles hors ligne
        run: |
          mkdir -p www/offline-assets/webfonts
          curl -L --fail -o www/offline-assets/fontawesome.css https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css
          grep -oE '../webfonts/[^)]+' www/offline-assets/fontawesome.css | sed 's#../webfonts/##' | sort -u | while read f; do
            curl -L --fail -o "www/offline-assets/webfonts/$f" "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/$f"
          done
          sed -i 's#../webfonts/#./webfonts/#g' www/offline-assets/fontawesome.css
          curl -L --fail -o www/offline-assets/google-fonts.css 'https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap'

      - name: Vérifier le contenu web
        run: |
          test -f www/index.html
          test -d www/bible-data
          echo "Contenu de www/bible-data :"
          find www/bible-data -maxdepth 3 -type f | head -100

      - name: Générer le projet Android Capacitor
        run: npx cap add android

      - name: Générer les icônes et le splash Android
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0f3b82' \
            --iconBackgroundColorDark '#071a3a' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#ffffff'

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Restaurer la clé de signature Release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ebiblia-release.p12
          chmod 600 android/app/ebiblia-release.p12
          test -s android/app/ebiblia-release.p12

      - name: Configurer la signature Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          cat > android/keystore.properties <<EOF
          storeFile=ebiblia-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "ebiblia-release.p12" not in text:
              signing = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      storeFile file("../app/" + keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          '''

              marker = "android {"
              if marker not in text:
                  raise SystemExit("Bloc android introuvable dans android/app/build.gradle")

              text = text.replace(marker, signing + "\\n" + marker, 1)

              if "signingConfig signingConfigs.release" not in text:
                  marker_build = "buildTypes {"
                  if marker_build not in text:
                      raise SystemExit("Bloc buildTypes introuvable dans android/app/build.gradle")

                  text = text.replace(
                      marker_build,
                      marker_build + '\n        release {\n            signingConfig signingConfigs.release\n        }',
                      1
                  )

              path.write_text(text)
          PY

          test -f android/keystore.properties
          grep -q "signingConfigs.release" android/app/build.gradle

      - name: Construire APK Debug et Release signé + AAB Release signé
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Vérifier les fichiers Android générés
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab

          echo "Fichiers générés :"
          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Vérifier la signature APK Release
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Nettoyer les secrets et fichiers de signature
        if: always()
        run: |
          rm -f android/app/ebiblia-release.p12
          rm -f android/keystore.properties

      - name: Publier APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: E-Biblia-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier APK Release signé
        uses: actions/upload-artifact@v4
        with:
          name: E-Biblia-APK-Release-Signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publier AAB Release signé
        uses: actions/upload-artifact@v4
        with:
          name: E-Biblia-AAB-Release-Signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
